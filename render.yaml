# Backend: the full Next.js app (API, portal sessions, reminder sweeps).
# The public site is served from Netlify, which proxies /api and /go here.
services:
  - type: web
    name: auravex-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/site
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: auravex
      # Seals stored credentials; must survive restarts (the free disk does not).
      - key: AURAVEX_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Render and Netlify both sit in front and append to X-Forwarded-For.
      - key: AURAVEX_TRUST_PROXY
        value: "1"
      - key: AURAVEX_PROXY_HOPS
        value: "2"
      # The Netlify site that proxies /api and /go here.
      - key: AURAVEX_ALLOWED_ORIGINS
        value: https://auravex-site.netlify.app
      # The site agent's model key; entered in the Render dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
